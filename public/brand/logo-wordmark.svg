<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 96" width="448" height="96" role="img" aria-label="CodeKraft">
  <!-- Placeholder "Kraft Bracket" wordmark (docs/08 §3.1). Ink follows currentColor; only the K chevron takes the accent token. -->
  <title>CodeKraft</title>
  <g font-family="'Space Grotesk', ui-sans-serif, system-ui, sans-serif" font-weight="700" font-size="72" letter-spacing="-2.5" fill="currentColor">
    <text x="0" y="70" textLength="196" lengthAdjust="spacingAndGlyphs">Code</text>
    <text x="270" y="70" textLength="178" lengthAdjust="spacingAndGlyphs">raft</text>
  </g>
  <!-- Redrawn K: stem in ink, arms replaced by a right-pointing chevron whose apex sits at the stem's mid-height. -->
  <rect x="208" y="18" width="13" height="52" fill="currentColor"/>
  <path d="M227 24 L253 44 L227 64" fill="none" stroke="var(--ck-color-accent, #9D8FFF)" stroke-width="13" stroke-linecap="butt" stroke-linejoin="miter"/>
</svg>
